<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/forgot-password.css" />
  </head>
  <body>
    <div class="container">
      <img src="lock-icon.png" alt="Lock Icon" class="icon" />
      <p class="info-text">Password will be sent to your email</p>
      <form action="login.html" method="post">
        <label for="email"><strong>Email</strong></label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />
        <button type="submit">Re-send Password</button>
      </form>
    </div>
  </body>
</html>
